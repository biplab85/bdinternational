<!doctype html><meta charset="utf-8"><title>Gallery check</title>
<body style="margin:0;background:#F4F6FA;font-family:system-ui;padding:20px">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:620px">
  <a style="grid-row:span 2;border-radius:14px;overflow:hidden;display:block"><img src="assets/img/gallery/g1.jpg" style="width:100%;aspect-ratio:3/4.4;object-fit:cover;display:block"></a>
  <a style="border-radius:14px;overflow:hidden;display:block"><img src="assets/img/gallery/g2.jpg" style="width:100%;aspect-ratio:4/3;object-fit:cover;display:block"></a>
  <a style="border-radius:14px;overflow:hidden;display:block"><img src="assets/img/gallery/g3.jpg" style="width:100%;aspect-ratio:4/3;object-fit:cover;display:block"></a>
  <a style="border-radius:14px;overflow:hidden;display:block"><img src="assets/img/gallery/g4.jpg" style="width:100%;aspect-ratio:4/3;object-fit:cover;display:block"></a>
  <a style="border-radius:14px;overflow:hidden;display:block;position:relative"><img src="assets/img/gallery/g5.jpg" style="width:100%;aspect-ratio:4/3;object-fit:cover;display:block"><span style="position:absolute;inset:0;display:grid;place-items:center;background:rgba(15,42,92,.68);color:#fff;font-size:24px;font-weight:800">+8</span></a>
</div>
</body>
